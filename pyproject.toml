[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis local-first family assistant scaffold"
requires-python = ">=3.14"
dependencies = [
  "cryptography>=43.0.0",
  "fastapi==0.115.0",
  "httpx2>=2.5.0",
  "psycopg[binary]>=3.2.0",
  "pydantic==2.12.0",
  "python-dotenv==1.0.1",
  "typing-extensions>=4.12.0",
  "uvicorn[standard]==0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==5.0.0",
  "ruff==0.8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov-fail-under=100"

[tool.setuptools.packages.find]
include = ["services*", "shared*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.8.2",
]
