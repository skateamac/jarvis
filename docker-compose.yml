services:
  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    env_file: [.env]
    environment:
      JARVIS_CONNECTORS_URL: http://connectors-google:8000
      JARVIS_SCHEDULER_URL: http://scheduler:8000
      DATABASE_URL: host=postgres port=5432 dbname=${POSTGRES_DB:-jarvis} user=${POSTGRES_USER:-jarvis} password=${POSTGRES_PASSWORD:-jarvis}
    # Internal-only: no host ports (reachable via Docker network / VPN host services).
    networks: [internal]
    depends_on: [postgres, redis, policy, connectors-google, scheduler]

  alexa-ingress:
    build:
      context: .
      dockerfile: services/alexa_ingress/Dockerfile
    env_file: [.env]
    environment:
      JARVIS_CORE_URL: http://core:8000
      JARVIS_ALEXA_SKIP_VERIFY: ${JARVIS_ALEXA_SKIP_VERIFY:-0}
      JARVIS_ALEXA_RATE_LIMIT_PER_MINUTE: ${JARVIS_ALEXA_RATE_LIMIT_PER_MINUTE:-60}
      JARVIS_ALEXA_MAX_BODY_BYTES: ${JARVIS_ALEXA_MAX_BODY_BYTES:-262144}
    # Sole public ingress exception.
    ports: ["8002:8000"]
    networks: [internal, public]
    depends_on: [core]

  policy:
    build:
      context: .
      dockerfile: services/policy/Dockerfile
    env_file: [.env]
    networks: [internal]

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: host=postgres port=5432 dbname=${POSTGRES_DB:-jarvis} user=${POSTGRES_USER:-jarvis} password=${POSTGRES_PASSWORD:-jarvis}
      JARVIS_SCHEDULER_AUTOTICK: ${JARVIS_SCHEDULER_AUTOTICK:-1}
      JARVIS_SCHEDULER_TICK_SECONDS: ${JARVIS_SCHEDULER_TICK_SECONDS:-5}
      JARVIS_EMAIL_SUMMARY_CADENCE: ${JARVIS_EMAIL_SUMMARY_CADENCE:-daily}
      JARVIS_EMAIL_SUMMARY_HOUR_LOCAL: ${JARVIS_EMAIL_SUMMARY_HOUR_LOCAL:-7}
      JARVIS_EMAIL_MAILBOXES: ${JARVIS_EMAIL_MAILBOXES:-household}
      JARVIS_EMAIL_GMAIL_QUERY: ${JARVIS_EMAIL_GMAIL_QUERY:-in:inbox newer_than:2d}
      JARVIS_EMAIL_SCHOOL_SENDER_DOMAINS: ${JARVIS_EMAIL_SCHOOL_SENDER_DOMAINS:-}
      JARVIS_EMAIL_SUMMARY_RETENTION_DAYS: ${JARVIS_EMAIL_SUMMARY_RETENTION_DAYS:-30}
      JARVIS_EMAIL_EXTRACT_MIN_CONFIDENCE: ${JARVIS_EMAIL_EXTRACT_MIN_CONFIDENCE:-0.6}
    # egress: Gmail/Calendar API calls from email_summary jobs.
    networks: [internal, egress]
    depends_on: [postgres]

  connectors-google:
    build:
      context: .
      dockerfile: services/connectors_google/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: host=postgres port=5432 dbname=${POSTGRES_DB:-jarvis} user=${POSTGRES_USER:-jarvis} password=${POSTGRES_PASSWORD:-jarvis}
      JARVIS_EMAIL_GMAIL_QUERY: ${JARVIS_EMAIL_GMAIL_QUERY:-in:inbox newer_than:2d}
      JARVIS_EMAIL_SCHOOL_SENDER_DOMAINS: ${JARVIS_EMAIL_SCHOOL_SENDER_DOMAINS:-}
      JARVIS_EMAIL_SUMMARY_RETENTION_DAYS: ${JARVIS_EMAIL_SUMMARY_RETENTION_DAYS:-30}
      JARVIS_EMAIL_EXTRACT_MIN_CONFIDENCE: ${JARVIS_EMAIL_EXTRACT_MIN_CONFIDENCE:-0.6}
      JARVIS_EMAIL_MAILBOXES: ${JARVIS_EMAIL_MAILBOXES:-household}
    # egress: Google OAuth + Calendar/Tasks/Gmail APIs (Zone D). No host ports.
    networks: [internal, egress]
    depends_on: [postgres]

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    env_file: [.env]
    environment:
      JARVIS_CORE_URL: http://core:8000
      JARVIS_CONNECTORS_URL: http://connectors-google:8000
      JARVIS_SCHEDULER_URL: http://scheduler:8000
      DATABASE_URL: host=postgres port=5432 dbname=${POSTGRES_DB:-jarvis} user=${POSTGRES_USER:-jarvis} password=${POSTGRES_PASSWORD:-jarvis}
      JARVIS_EMAIL_SCHOOL_SENDER_DOMAINS: ${JARVIS_EMAIL_SCHOOL_SENDER_DOMAINS:-}
      JARVIS_EMAIL_EXTRACT_MIN_CONFIDENCE: ${JARVIS_EMAIL_EXTRACT_MIN_CONFIDENCE:-0.6}
    # VPN-only surface: published on host for Tailscale/WireGuard access.
    ports: ["8006:8000"]
    networks: [internal, private_access]
    depends_on: [core, connectors-google]

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [internal]

  redis:
    image: redis:8.10-alpine
    volumes: [redis_data:/data]
    networks: [internal]

networks:
  internal:
    internal: true
  public:
  private_access:
  # Outbound-only style access for Google APIs; not attached to host-published routes.
  egress:

volumes:
  postgres_data:
  redis_data:
